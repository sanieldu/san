<style>
  :root{ --bg:#f7f5f0; --ink:#1c1b19; --muted:#6b675f; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#151513; --ink:#ecebe6; --muted:#9b978e; } }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(32px,6vw,52px);letter-spacing:-.01em;text-align:center}

  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}

  .screen{background:#151513;border-radius:22px;padding:14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -20px rgba(0,0,0,.45)}
  #doxie{display:block;width:min(78vw,380px);aspect-ratio:88/75}
  .caption{font:13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.08em;text-decoration:none;padding:4px 2px;border-bottom:1px dashed transparent;transition:color .15s,border-color .15s}

           font:13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);text-decoration:none;transition:color .15s,border-color .15s,transform .15s}
  .links a:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-1px)}
  .links svg{width:15px;height:15px}
  @media (prefers-reduced-motion: reduce){ .dots span{animation:none} }

<script>
// Shaded ASCII dachshund puppy (front view). Ray-marches a few signed-distance
// shapes per character cell, lights them, and picks a glyph by brightness.
(function (root) {
  const RAMP = " .,:;i1tfLCG08@";

  const len3 = (x, y, z) => Math.sqrt(x * x + y * y + z * z);
  const smin = (a, b, k) => {
    const h = Math.max(k - Math.abs(a - b), 0) / k;
    return Math.min(a, b) - h * h * k * 0.25;
  };
  const ell = (x, y, z, rx, ry, rz) => {
    const k0 = len3(x / rx, y / ry, z / rz);
    const k1 = len3(x / (rx * rx), y / (ry * ry), z / (rz * rz));
    return k0 * (k0 - 1) / (k1 || 1e-6);
  };

  // materials: 0 fur, 1 ear, 2 nose, 3 eye
  const hitInfo = { m: 0, x: 0, y: 0, z: 0, wy: 0 };
  function scene(x, y, z, st) {
    // head moves: bob + small sway
    let hx = x, hy = y - st.bob, hz = z;
    let c = Math.cos(st.yaw), s = Math.sin(st.yaw);
    let X = c * hx - s * hz, Z = s * hx + c * hz; hx = X; hz = Z;
    c = Math.cos(st.tilt); s = Math.sin(st.tilt);
    let Y = c * hy - s * hx; X = s * hy + c * hx; hx = X; hy = Y;

    const skull = ell(hx, hy - 0.12, hz, 0.6, 0.55, 0.52);
    const cheeks = ell(hx, hy + 0.12, hz - 0.18, 0.5, 0.32, 0.36);
    const muzzle = ell(hx, hy + 0.17, hz - 0.42, 0.3, 0.22, 0.27);
    const head = smin(smin(skull, cheeks, 0.2), muzzle, 0.18);
    let d = head;
    let m = 0;

    // ears hang from the sides; they only swing a little, lagging the bob
    let earBest = 1e9;
    for (const side of [-1, 1]) {
      const ang = side * (0.1 + st.earSwing);
      const ex = hx - side * 0.5, ey = hy - 0.28, ez = hz + 0.04;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const rx = ca * ex - sa * ey, ry = sa * ex + ca * ey;
      const ear = ell(rx - side * 0.13, ry + 0.52, ez, 0.14, 0.6, 0.3);
      if (ear < earBest) earBest = ear;
    }
    if (earBest < d) { d = earBest; m = 1; }

    const nose = ell(hx, hy + 0.12, hz - 0.68, 0.12, 0.09, 0.09);
    if (nose < d) { d = nose; m = 2; }
    const eye = Math.min(len3(hx - 0.25, hy - 0.12, hz - 0.43), len3(hx + 0.25, hy - 0.12, hz - 0.43)) - 0.12;
    if (eye < d) { d = eye; m = 3; }

    // santa hat: tilted cone with a floppy tip, white brim and pom-pom
    {
      const tc = Math.cos(-0.22), ts = Math.sin(-0.22);
      const px = tc * hx - ts * (hy - 0.5), py = ts * hx + tc * (hy - 0.5), pz = hz + 0.04;
      // brim: torus around the crown
      const q = Math.sqrt(px * px + pz * pz) - 0.43;
      const brim = Math.sqrt(q * q + py * py * 1.6) - 0.1;
      // cone body: round cone from brim to droopy tip
      const ax = 0, ay = 0.05, az = 0, bx = 0.42, by = 0.62, bz = -0.05, ra = 0.42, rb = 0.05;
      const bax = bx - ax, bay = by - ay, baz = bz - az;
      const L2 = bax * bax + bay * bay + baz * baz;
      const hh = Math.max(0, Math.min(1, ((px - ax) * bax + (py - ay) * bay + (pz - az) * baz) / L2));
      const cone = (len3(px - ax - bax * hh, py - ay - bay * hh, pz - az - baz * hh) - (ra + (rb - ra) * hh)) * 0.8;
      const pom = len3(px - 0.5, py - 0.62, pz + 0.05) - 0.12;
      if (cone < d) { d = cone; m = 4; }
      if (brim < d) { d = brim; m = 5; }
      if (pom < d) { d = pom; m = 5; }
    }

    hitInfo.m = m; hitInfo.x = hx; hitInfo.y = hy; hitInfo.z = hz; hitInfo.wy = y;
    return d;
  }

  const BROWN = [124, 66, 36], TAN = [222, 150, 78], EAR = [112, 58, 32];
  const NOSE = [60, 36, 30], EYE = [58, 34, 22], HAT = [206, 38, 44], FLUFF = [236, 232, 226];

  function furColor(h) {
    // tan eyebrow spots
    const bx = Math.abs(h.x) - 0.24, by = h.y - 0.33;
    if (h.z > 0.2 && bx * bx + by * by * 1.6 < 0.007) return TAN;
    // tan muzzle + cheeks
    if (h.y < 0.02 && h.z > 0.12 && h.wy > -0.55) {
      if (h.y + 0.02 + Math.abs(h.x) * 0.25 < 0.04) return TAN;
    }
    // tan chest bib
    if (h.wy < -0.55 && h.z > 0.15) {
      if (Math.abs(h.x) + (h.wy + 0.55) * 0.5 < 0.12) return TAN;
    }
    return BROWN;
  }

  function render(cols, rows, t, cellAspect) {
    const st = {
      bob: Math.sin(t * 2.4) * 0.07,
      yaw: Math.sin(t * 0.8) * 0.12,
      tilt: Math.sin(t * 1.2) * 0.06,
      // ears trail the head a little: small, lagged swing tied to the bob
      earSwing: Math.cos(t * 2.4 - 0.5) * 0.045,
    };
    const lx = -0.25, ly = 0.35, lz = 0.9, ll = len3(lx, ly, lz);
    const out = new Array(rows * cols);
    const camZ = 4.6, fov = 0.275;
    const ox = 0.05, oy = 0.24, oz = camZ;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const u = ((i + 0.5) / cols * 2 - 1) * fov * cols / rows * cellAspect;
        const v = -((j + 0.5) / rows * 2 - 1) * fov;
        let dx = u, dy = v, dz = -1;
        const dl = len3(dx, dy, dz); dx /= dl; dy /= dl; dz /= dl;
        let tt = 2.5, hit = -1;
        for (let k = 0; k < 64; k++) {
          const d = scene(ox + dx * tt, oy + dy * tt, oz + dz * tt, st);
          if (d < 0.004) { hit = tt; break; }
          tt += d * 0.85;
          if (tt > 7) break;
        }
        if (hit < 0) { out[j * cols + i] = null; continue; }
        const px = ox + dx * hit, py = oy + dy * hit, pz = oz + dz * hit, e = 0.004;
        scene(px, py, pz, st);
        const h = { m: hitInfo.m, x: hitInfo.x, y: hitInfo.y, z: hitInfo.z, wy: hitInfo.wy };
        const nx = scene(px + e, py, pz, st) - scene(px - e, py, pz, st);
        const ny = scene(px, py + e, pz, st) - scene(px, py - e, pz, st);
        const nz = scene(px, py, pz + e, st) - scene(px, py, pz - e, st);
        const nl = len3(nx, ny, nz) || 1;
        const key = Math.max(0, (nx * lx + ny * ly + nz * lz) / (nl * ll));
        const fill = Math.max(0, (nx * 0.2 - ny * 0.5 + nz * 0.85) / nl) * 0.45;
        const ndl = Math.min(1, key + fill);
        const rim = Math.pow(1 - Math.max(0, nz / nl), 3) * 0.2;
        const shiny = h.m === 2 || h.m === 3;
        const spec = Math.pow(Math.max(0, (nx * -0.3 + ny * 0.45 + nz * 0.85) / nl), shiny ? 40 : 18) * (shiny ? 1.4 : 0.2);
        let b = Math.min(1, 0.12 + 0.88 * ndl + rim + spec);
        if (h.m === 3) b = Math.min(1, 0.35 + 0.3 * ndl + spec);
        if (h.m === 2) b = Math.min(1, 0.3 + 0.4 * ndl + spec);
        const p = [null, EAR, NOSE, EYE, HAT, FLUFF][h.m] || furColor(h);
        const lit = 0.5 + 0.75 * b;
        out[j * cols + i] = {
          ch: RAMP[Math.min(RAMP.length - 1, 1 + Math.floor(b * (RAMP.length - 1)))],
          r: Math.min(255, p[0] * lit + spec * 230) | 0,
          g: Math.min(255, p[1] * lit + spec * 230) | 0,
          b: Math.min(255, p[2] * lit + spec * 230) | 0,
        };
      }
    }
    return out;
  }

  root.Doxie = { render };
})(typeof window !== "undefined" ? window : globalThis);

(function () {
  const COLS = 88, ROWS = 75;
  const canvas = document.getElementById("doxie");
  const ctx = canvas.getContext("2d");
  let cw = 0, ch = 0, fontPx = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(w * ROWS / COLS * dpr);
    ch = canvas.height / ROWS;
    fontPx = ch * 0.95;
    ctx.font = "600 " + fontPx + "px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
    cw = canvas.width / COLS;
    ctx.textBaseline = "top";
    ctx.textAlign = "center";
  }
  function draw(t) {
    const cells = Doxie.render(COLS, ROWS, t, cw / ch);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let j = 0; j < ROWS; j++) {
      for (let i = 0; i < COLS; i++) {
        const c = cells[j * COLS + i];
        if (!c || c.ch === " ") continue;
        ctx.fillStyle = "rgb(" + c.r + "," + c.g + "," + c.b + ")";
        ctx.fillText(c.ch, (i + 0.5) * cw, j * ch);
      }
    }
  }
  resize();
  window.addEventListener("resize", resize);
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) { draw(0.6); return; }
  let last = 0;
  function loop(now) {
    if (now - last > 33) { draw(now / 1000); last = now; }  // ~30 fps
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
