<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>dsu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231c1b19'/><text x='50%' y='54%' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-size='30' fill='%23f6f4ef'>DS</text></svg>">
<style>
  :root{ --bg:#f7f5f0; --ink:#1c1b19; --muted:#6b675f; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#151513; --ink:#ecebe6; --muted:#9b978e; } }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(32px,6vw,52px);letter-spacing:-.01em;text-align:center}
  .dots span{display:inline-block;animation:blink 1.4s infinite both}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .dots span{animation:none} }
</style>
</head>
<body>
  <h1>cool things are on the way<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
</body>
</html>
